<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Zamonaviy kasblar monitoringi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <button class="brand__logo" id="logo" type="button" aria-label="Ustoz AI">
          <img src="img/ustoz-ai-logo.png" alt="Ustoz AI" width="237" height="98">
        </button>
        <div class="brand__text">
          <div class="brand__title" id="brand-title"></div>
          <div class="brand__sub" id="brand-sub"></div>
        </div>
      </div>
      <nav class="regions" id="regions"></nav>
      <div class="legend" id="legend"></div>
    </aside>

    <main class="main">
      <div class="toprow">
        <div id="back"></div>
        <div class="tools" id="tools"></div>
        <div class="langs" id="langs" role="group" aria-label="Til / Язык / Language"></div>
      </div>
      <header class="topbar">
        <div class="topbar__text">
          <div class="topbar__crumb" id="crumb"></div>
          <h1 class="topbar__title" id="title"></h1>
        </div>
        <div class="datebox">
          <div class="datebox__label" id="date-label"></div>
          <div class="datebox__value" id="date"></div>
        </div>
      </header>

      <section class="status" id="status"></section>
      <section class="cards" id="cards"></section>
      <div class="main-body" id="main-body"></div>

      <footer class="foot" id="foot"></footer>
    </main>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal" id="admin" hidden>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="admin-title" id="admin-body"></div>
  </div>

  <script src="./firebase-config.js"></script>
  <script src="./i18n.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
